<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FileSwap — Download</title>
<style>
:root{--bg:#f6f8f7;--line:#e2e8e5;--tx:#1b2a25;--mut:#6b7c76;--ac:#0a8f67;--ac-d:#087a58;--ac-l:#e3f4ee;--red:#d6334b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.logo{width:32px;height:32px;border-radius:8px;background:var(--ac);display:grid;place-items:center}
.bt{font-weight:700;font-size:16px;line-height:1.1}
.bt small{display:block;font-weight:500;font-size:11px;color:var(--mut)}
main{flex:1;display:grid;place-items:center;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;width:min(440px,100%);padding:26px;box-shadow:0 8px 28px rgba(20,40,32,.08)}
h2{font-size:18px;margin-bottom:4px}
.desc{color:var(--mut);margin-bottom:18px;line-height:1.5}
.file{display:flex;align-items:center;gap:12px;padding:14px;background:var(--bg);border-radius:12px;margin-bottom:18px}
.ico{width:44px;height:44px;border-radius:10px;background:var(--ac-l);display:grid;place-items:center;font-size:22px;flex:none}
.nm{font-weight:600;overflow-wrap:anywhere}
.sub{color:var(--mut);font-size:12px;margin-top:3px}
#dl{width:100%;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:13px;font:600 15px inherit;font-family:inherit;cursor:pointer}
#dl:hover:not(:disabled){background:var(--ac-d)}
#dl:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pb{height:5px;background:var(--line);border-radius:5px;margin-top:12px;overflow:hidden;display:none}
.pb i{display:block;height:100%;width:0;background:var(--ac);transition:width .15s}
#msg{margin-top:12px;font-size:13px;color:var(--mut);min-height:18px;line-height:1.5}
#msg.err{color:var(--red)}
#msg a{color:var(--ac);font-weight:600}
.bad{text-align:center}
.bad .ico{margin:0 auto 12px;background:#fde8eb}
.foot{margin-top:20px;text-align:center;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<header>
  <a href="https://fileswap.nekoweb.org/" class="brand">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M4 17v3h16v-3"/></svg></div>
    <div class="bt">FileSwap<small>Made by Amrit</small></div>
  </a>
</header>

<main>
  <div class="card" id="ok">
    <h2>Your file is ready</h2>
    <p class="desc">The download starts right here, no extra pages.</p>
    <div class="file">
      <div class="ico" id="ico">📦</div>
      <div><div class="nm" id="nm">Looking up file…</div><div class="sub" id="sub"></div></div>
    </div>
    <button id="dl" disabled>Download</button>
    <div class="pb" id="pb"><i id="pbi"></i></div>
    <div id="msg"></div>
    <div class="foot">Shared with FileSwap by Amrit</div>
  </div>

  <div class="card bad" id="bad" style="display:none">
    <div class="ico">❌</div>
    <h2>File not found</h2>
    <p class="desc" style="margin:0">This link is missing its file code or is no longer valid.</p>
  </div>
</main>

<script>
// Same origin as the Railway server
const PROXY='';
const $=id=>document.getElementById(id);
const fmt=b=>!b?'':b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(2)+' GB';
const icon=n=>{
  const e=(n.split('.').pop()||'').toLowerCase();
  return ['mp4','mkv','avi','mov','webm'].includes(e)?'\u{1F3AC}':['jpg','jpeg','png','gif','webp','svg'].includes(e)?'\u{1F5BC}\uFE0F':
    ['mp3','wav','flac','m4a'].includes(e)?'\u{1F3B5}':['zip','rar','7z','tar','gz'].includes(e)?'\u{1F4E6}':
    ['pdf','doc','docx','txt'].includes(e)?'\u{1F4C4}':'\u{1F4C1}';
};
function getCode(){
  // https://app/CODE  (or /d/CODE); falls back to the old #CODE style
  const seg=location.pathname.split('/').filter(Boolean);
  const last=seg[seg.length-1]||'';
  if(last&&last!=='download.html'&&last!=='d') return last.trim();
  return (location.hash||'').replace(/^#\/?(file\/)?/,'').trim();
}
const code=getCode();
const say=(t,err)=>{const m=$('msg');m.className=err?'err':'';m.textContent=t};
const notFound=t=>{$('ok').style.display='none';$('bad').style.display='block';if(t)$('bad').querySelector('p').textContent=t};

let retryTimer=0;
async function init(){
  if(!code) return notFound();
  try{
    const r=await fetch(`${PROXY}/api/info?code=${encodeURIComponent(code)}`);
    if(r.status===404) return notFound('This file was deleted or has expired.');
    if(r.status===429){
      const w=+r.headers.get('retry-after')||30;
      $('nm').textContent='File '+code; $('sub').textContent='Server is busy';
      say(`The server is busy right now. Retrying in ${w}s…`);
      clearTimeout(retryTimer); retryTimer=setTimeout(init,w*1000);
      return;
    }
    if(!r.ok) throw new Error('HTTP '+r.status);
    const f=await r.json();
    $('nm').textContent=f.name; $('ico').textContent=icon(f.name); $('sub').textContent=fmt(f.size);
    say(''); $('dl').disabled=false;
  }catch(e){
    $('nm').textContent='File '+code; $('sub').textContent='Details unavailable';
    say('Could not reach the download server. Try again in a moment.',true);
    $('dl').disabled=false;
  }
}

$('dl').onclick=async()=>{
  // Check first (the server caches the lookup), so errors show here instead of a failed download
  $('dl').disabled=true;
  try{
    const r=await fetch(`${PROXY}/api/info?code=${encodeURIComponent(code)}`);
    if(r.status===429){const w=+r.headers.get('retry-after')||30; say(`The server is busy. Try again in ${w} seconds.`,true); return}
    if(r.status===404) return notFound('This file was deleted or has expired.');
    if(!r.ok){say('Download server error. Try again in a moment.',true); return}
    const a=document.createElement('a');
    a.href=`${PROXY}/api/dl?code=${encodeURIComponent(code)}`;
    a.download='';
    document.body.appendChild(a); a.click(); a.remove();
    say('Your download has started. Check your downloads.');
  }catch(e){say('Could not reach the download server.',true)}
  finally{setTimeout(()=>$('dl').disabled=false,1500)}
};
init();
</script>
</body>
</html>
