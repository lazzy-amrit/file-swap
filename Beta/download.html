<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FileSwap — My Files</title>
<style>
:root{--bg:#f6f8f7;--panel:#fff;--line:#e2e8e5;--tx:#1b2a25;--mut:#6b7c76;--ac:#0a8f67;--ac-d:#087a58;--ac-l:#e3f4ee;--red:#d6334b;--sh:0 8px 28px rgba(20,40,32,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
body{display:flex;flex-direction:column}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex:none}
.logo{width:32px;height:32px;border-radius:8px;background:var(--ac);display:grid;place-items:center}
.bt{font-weight:700;font-size:16px;line-height:1.1}
.bt small{display:block;font-weight:500;font-size:11px;color:var(--mut)}
#search{flex:1;max-width:520px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 14px}
#search:focus{background:#fff;border-color:var(--ac);outline:none}

main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.tb{display:flex;align-items:center;gap:12px;padding:16px 24px 10px}
.tb h1{font-size:18px;font-weight:600;flex:1}
.tb h1 small{font-weight:400;color:var(--mut);font-size:13px;margin-left:8px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--ac-d)}
.btn.g{background:#fff;color:var(--tx);border:1px solid var(--line)}
.btn.g:hover{background:var(--bg)}
.btn.r{background:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 11px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--ac-l);color:var(--ac)}

#wrap{flex:1;overflow:auto;padding:0 24px 24px}
.head,.row{display:grid;grid-template-columns:minmax(0,1fr) 90px 130px 110px 96px;gap:12px;align-items:center;padding:0 14px}
.head{position:sticky;top:0;background:var(--bg);z-index:2;height:36px;color:var(--mut);font-size:12px;font-weight:600;border-bottom:1px solid var(--line)}
.row{height:54px;background:var(--panel);border-bottom:1px solid var(--line)}
.row:hover{background:#f1f7f4}
.row.exp{opacity:.55}
.nmc{display:flex;align-items:center;gap:12px;min-width:0}
.ico{width:34px;height:34px;border-radius:8px;background:var(--ac-l);display:grid;place-items:center;flex:none;font-size:17px}
.nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mut{color:var(--mut);font-size:13px}
.acts{display:flex;justify-content:flex-end;gap:2px}
.ib{background:none;border:0;border-radius:7px;width:32px;height:32px;cursor:pointer;color:var(--mut);font-size:16px}
.ib:hover{background:var(--ac-l);color:var(--ac)}
#list.grid .head{display:none}
#list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;padding-top:6px}
#list.grid .row{display:flex;flex-direction:column;align-items:stretch;height:auto;gap:8px;padding:16px;border:1px solid var(--line);border-radius:12px}
#list.grid .row .mut.hide-g{display:none}
#list.grid .ico{width:54px;height:54px;font-size:26px}
#list.grid .nmc{flex-direction:column;align-items:flex-start}
#list.grid .acts{justify-content:flex-start}

.empty{margin:60px auto;text-align:center;color:var(--mut);max-width:320px;line-height:1.6}
.empty b{display:block;color:var(--tx);font-size:16px;margin:8px 0 4px}
.empty span{font-size:40px}

#dropHint{position:absolute;inset:8px;border:2px dashed var(--ac);border-radius:14px;background:rgba(10,143,103,.08);display:none;place-items:center;font-weight:600;color:var(--ac);z-index:10;pointer-events:none}
#dropHint.on{display:grid}

.ov{position:fixed;inset:0;background:rgba(15,30,25,.45);display:none;place-items:center;z-index:50;padding:16px}
.ov.on{display:grid}
.card{background:#fff;border-radius:16px;width:min(480px,100%);padding:22px;max-height:90vh;overflow:auto;box-shadow:var(--sh)}
.card h3{font-size:17px;margin-bottom:14px}
.rowb{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.drop{border:2px dashed var(--line);border-radius:12px;padding:24px 14px;text-align:center;color:var(--mut)}
.drop .rowb{justify-content:center;margin-top:12px}
.q{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg);border-radius:9px;margin-top:8px}
.q .nm{font-size:13px}
.q small{color:var(--mut);white-space:nowrap}
.q.err small{color:var(--red);font-weight:600}
.pb{height:4px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--ac);width:0;transition:width .2s}
input.f{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font:inherit}
input.f:focus{border-color:var(--ac);outline:none}
dl{display:grid;grid-template-columns:90px 1fr;gap:9px 12px;font-size:13px}
dt{color:var(--mut)}dd{overflow-wrap:anywhere}
code{display:block;background:var(--bg);padding:8px 10px;border-radius:8px;font:12px ui-monospace,Consolas,monospace;margin-top:4px;cursor:pointer;overflow-wrap:anywhere;border:1px solid var(--line)}
code:hover{border-color:var(--ac)}

.menu{position:fixed;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:var(--sh);z-index:60;display:none;min-width:190px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 11px;border-radius:7px;cursor:pointer}
.menu button:hover{background:var(--bg)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:24px;display:none;z-index:100;font-size:13px}

@media(max-width:640px){
 .head,.row{grid-template-columns:minmax(0,1fr) 70px 96px}
 .head span:nth-child(3),.row .c-up,.head span:nth-child(4){display:none}
 #wrap{padding:0 12px 16px}.tb{padding:12px}
 .bt small{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <a href="index.html" class="brand">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M4 17v3h16v-3"/></svg></div>
    <div class="bt">FileSwap<small>Made by Amrit</small></div>
  </a>
  <input id="search" type="search" placeholder="Search files" aria-label="Search files">
</header>

<main id="main">
  <div class="tb">
    <h1>My files<small id="count"></small></h1>
    <div class="seg" role="group" aria-label="View">
      <button id="vList" class="on" title="List view">☰</button>
      <button id="vGrid" title="Grid view">▦</button>
    </div>
    <button class="btn" id="plus">+ Upload</button>
  </div>
  <div id="wrap">
    <div id="list"></div>
  </div>
  <div id="dropHint">Drop files to upload</div>
</main>

<!-- Upload -->
<div class="ov" id="upOv"><div class="card">
  <h3>Upload files</h3>
  <div class="drop">Drop files anywhere, or choose below
    <div class="rowb">
      <button class="btn g" id="pickF">Select files</button>
      <button class="btn g" id="pickD">Select folder</button>
    </div>
  </div>
  <div id="qList"></div>
  <div class="rowb">
    <button class="btn g" id="upCancel">Close</button>
    <button class="btn" id="upGo" disabled>Start upload</button>
  </div>
  <input type="file" id="inF" multiple hidden>
  <input type="file" id="inD" webkitdirectory hidden>
</div></div>

<!-- Rename -->
<div class="ov" id="rnOv"><div class="card" style="width:min(380px,100%)">
  <h3>Rename</h3>
  <input class="f" id="rnIn" placeholder="File name">
  <div class="rowb"><button class="btn g" id="rnNo">Cancel</button><button class="btn" id="rnOk">Save</button></div>
</div></div>

<!-- Details -->
<div class="ov" id="dtOv"><div class="card">
  <h3>File details</h3>
  <div id="dtBody"></div>
  <div class="rowb"><button class="btn g" id="dtClose">Close</button></div>
</div></div>

<div class="menu" id="menu"></div>
<div id="toast"></div>

<script>
const KEY='fileswap.v1', VK='fileswap.view';
const KEEP_DAYS=10;
const ONLINE_DOMAIN=location.origin+'/';   // this page is served by the same server that serves downloads
// Change to 'download.html' base if you test locally
const $=id=>document.getElementById(id);

let items=[], queue=[], busy=false, filter='', view='list';
try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}
try{view=localStorage.getItem(VK)||'list'}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}};

/* helpers */
const fmtSize=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(2)+' GB';
const expiresAt=i=>(i.at||Date.now())+KEEP_DAYS*864e5;
const isExp=i=>expiresAt(i)<=Date.now();
function left(i){
  const ms=expiresAt(i)-Date.now(); if(ms<=0) return 'Expired';
  const d=Math.floor(ms/864e5),h=Math.floor((ms%864e5)/36e5);
  return d?`${d}d ${h}h left`:`${h}h ${Math.floor((ms%36e5)/6e4)}m left`;
}
const clock=t=>new Date(t).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const icon=n=>{
  const e=(n.split('.').pop()||'').toLowerCase();
  return ['mp4','mkv','avi','mov','webm'].includes(e)?'🎬':
    ['jpg','jpeg','png','gif','webp','svg'].includes(e)?'🖼️':
    ['mp3','wav','flac','m4a'].includes(e)?'🎵':
    ['zip','rar','7z','tar','gz'].includes(e)?'📦':
    ['pdf','doc','docx','txt'].includes(e)?'📄':'📁';
};
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const copy=t=>navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Copy failed'));
const codeOf=i=>i.code||(i.url||'').split('/').filter(Boolean).pop()||i.id;   // old items only
const shareLink=i=>`${ONLINE_DOMAIN}${i.key?i.id:codeOf(i)}`;

/* render */
function render(){
  const l=$('list');
  l.className=view==='grid'?'grid':'';
  $('vList').classList.toggle('on',view==='list');
  $('vGrid').classList.toggle('on',view==='grid');
  const shown=items.filter(i=>i.name.toLowerCase().includes(filter)).sort((a,b)=>b.at-a.at);
  $('count').textContent=items.length?`${items.length} file${items.length>1?'s':''}`:'';
  if(!shown.length){
    l.innerHTML=`<div class="empty"><span>📂</span><b>${items.length?'No matching files':'No files yet'}</b>${items.length?'Try a different name.':'Select Upload or drop files here to get a share link.'}</div>`;
    return;
  }
  l.innerHTML=`<div class="head"><span>Name</span><span>Size</span><span>Uploaded</span><span>Expires</span><span></span></div>`+
  shown.map(i=>`<div class="row ${isExp(i)?'exp':''}">
    <div class="nmc"><div class="ico">${icon(i.name)}</div><div class="nm" title="${esc(i.name)}">${esc(i.name)}</div></div>
    <div class="mut">${fmtSize(i.size)}</div>
    <div class="mut c-up">${clock(i.at)}</div>
    <div class="mut">${left(i)}</div>
    <div class="acts">
      <button class="ib" data-a="share" data-id="${esc(i.id)}" title="Copy share link">🔗</button>
      <button class="ib" data-a="more" data-id="${esc(i.id)}" title="More actions" aria-label="More actions">⋮</button>
    </div>
  </div>`).join('');
}
setInterval(render,60000);

/* menu + row actions */
const menu=$('menu');
$('list').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  e.stopPropagation();
  const it=items.find(x=>x.id===b.dataset.id); if(!it) return;
  if(b.dataset.a==='share'){copy(shareLink(it));return}
  const r=b.getBoundingClientRect();
  menu.innerHTML=`<button data-m="open">⬇️ Open download page</button><button data-m="rn">✏️ Rename</button><button data-m="dt">ℹ️ Details</button><button data-m="rm" style="color:var(--red)">🗑️ Delete</button>`;
  menu.dataset.id=it.id; menu.style.display='block';
  menu.style.left=Math.max(8,Math.min(r.right-190,innerWidth-200))+'px';
  menu.style.top=Math.min(r.bottom+4,innerHeight-180)+'px';
});
document.addEventListener('click',()=>menu.style.display='none');
menu.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const it=items.find(x=>x.id===menu.dataset.id); if(!it) return;
  const a=b.dataset.m;
  if(a==='open') window.open(shareLink(it),'_blank','noopener');
  if(a==='rn') askRename(it.name,n=>{it.name=n;save();render()});
  if(a==='dt') showDetails(it);
  if(a==='rm') del(it);
});

/* rename (changes the name shown in this dashboard only) */
let rnCb=null;
function askRename(cur,cb){rnCb=cb;$('rnIn').value=cur;$('rnOv').classList.add('on');setTimeout(()=>$('rnIn').select(),50)}
const rnDone=ok=>{const v=$('rnIn').value.trim();$('rnOv').classList.remove('on');if(ok&&v&&rnCb)rnCb(v);rnCb=null};
$('rnOk').onclick=()=>rnDone(true);
$('rnNo').onclick=()=>rnDone(false);
$('rnIn').onkeydown=e=>{if(e.key==='Enter')rnDone(true);if(e.key==='Escape')rnDone(false)};

/* details */
function showDetails(i){
  const link=shareLink(i);
  $('dtBody').innerHTML=`<dl>
    <dt>Name</dt><dd>${esc(i.name)}</dd>
    <dt>Original</dt><dd>${esc(i.orig)}</dd>
    <dt>Size</dt><dd>${fmtSize(i.size)}</dd>
    <dt>Uploaded</dt><dd>${clock(i.at)}</dd>
    <dt>Expiry</dt><dd>${left(i)}</dd></dl>
    <h4 style="margin:16px 0 4px;font-size:13px;color:var(--mut)">Share link (tap to copy)</h4>
    <code data-c="${esc(link)}">${esc(link)}</code>`;
  $('dtOv').classList.add('on');
}
$('dtBody').onclick=e=>{const c=e.target.closest('code');if(c)copy(c.dataset.c)};
$('dtClose').onclick=()=>$('dtOv').classList.remove('on');

/* delete */
async function del(i){
  if(!confirm(`Delete "${i.name}"? The share link will stop working.`)) return;
  let warn='';
  if(i.key){
    try{
      const r=await fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:i.id,key:i.key})});
      if(!r.ok&&r.status!==404) warn='Removed from your list, but the server could not delete the file';
    }catch(e){warn='Removed from your list, but the server could not be reached'}
  }else warn='Removed from your list only (older upload)';
  items=items.filter(x=>x.id!==i.id); save(); render(); toast(warn||'File deleted');
}

/* upload dialog */
const openUp=()=>{$('upOv').classList.add('on');drawQ()};
const closeUp=()=>{if(busy)return;$('upOv').classList.remove('on')};
$('plus').onclick=openUp;
$('upCancel').onclick=closeUp;
$('pickF').onclick=()=>{$('inF').value='';$('inF').click()};
$('pickD').onclick=()=>{$('inD').value='';$('inD').click()};
$('inF').onchange=e=>addFiles(e.target.files);
$('inD').onchange=e=>addFiles(e.target.files);
function addFiles(list){
  if(!list||!list.length) return;
  for(const f of list) queue.push({f,name:f.name,st:'ready',pct:0});
  openUp();
}
function drawQ(){
  $('qList').innerHTML=queue.map((q,n)=>`<div class="q ${q.st==='error'?'err':''}" data-n="${n}">
    <div style="flex:1;min-width:0"><div class="nm">${icon(q.name)} ${esc(q.name)}</div>
    ${q.st==='uploading'?`<div class="pb"><i style="width:${q.pct}%"></i></div>`:''}</div>
    <small>${q.st==='error'?esc(q.err):q.st==='uploading'?q.pct+'%':fmtSize(q.f.size)}</small>
    ${busy?'':`<button class="ib" data-x="${n}" aria-label="Remove">✕</button>`}</div>`).join('');
  $('upGo').disabled=busy||!queue.some(q=>q.st!=='done');
}
$('qList').onclick=e=>{
  if(busy) return;
  const x=e.target.closest('[data-x]');
  if(x){queue.splice(+x.dataset.x,1);drawQ();return}
  const r=e.target.closest('.q');
  if(r){const q=queue[+r.dataset.n];askRename(q.name,n=>{q.name=n;drawQ()})}
};

/* drag & drop (whole page) */
let dragDepth=0;
addEventListener('dragenter',e=>{e.preventDefault();dragDepth++;$('dropHint').classList.add('on')});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('dragleave',e=>{e.preventDefault();if(--dragDepth<=0){dragDepth=0;$('dropHint').classList.remove('on')}});
addEventListener('drop',e=>{
  e.preventDefault();dragDepth=0;$('dropHint').classList.remove('on');
  if(e.dataTransfer&&e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});

/* upload: the file goes to this site's own server */
function send(q){
  return new Promise(res=>{
    q.st='uploading';q.pct=0;drawQ();
    const x=new XMLHttpRequest();
    x.open('POST','/api/upload?name='+encodeURIComponent(q.name));
    x.setRequestHeader('Content-Type','application/octet-stream');
    x.upload.onprogress=e=>{if(e.lengthComputable){q.pct=Math.round(e.loaded/e.total*100);drawQ()}};
    x.onload=()=>{
      let j={};try{j=JSON.parse(x.responseText)}catch(e){}
      if(x.status===200&&j.id){
        items.push({id:j.id,key:j.key,name:j.name||q.name,orig:q.f.name,size:q.f.size,at:Date.now()});
        save();q.st='done';
      }else{q.st='error';q.err=j.error||('Error '+x.status)}
      res();
    };
    x.onerror=()=>{q.st='error';q.err='Network error';res()};
    x.send(q.f);
  });
}
$('upGo').onclick=async()=>{
  busy=true;drawQ();
  for(const q of queue.filter(q=>q.st!=='done')){await send(q);render()}
  busy=false;
  const ok=queue.filter(q=>q.st==='done').length;
  queue=queue.filter(q=>q.st==='error');
  drawQ();
  if(!queue.length) $('upOv').classList.remove('on');
  const bad=queue.find(q=>q.st==='error');
  toast(ok?`${ok} file${ok>1?'s':''} uploaded`:(bad?bad.err:'Upload failed'));
};

/* misc */
$('search').oninput=e=>{filter=e.target.value.trim().toLowerCase();render()};
$('vList').onclick=()=>{view='list';try{localStorage.setItem(VK,view)}catch(e){}render()};
$('vGrid').onclick=()=>{view='grid';try{localStorage.setItem(VK,view)}catch(e){}render()};
addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  ['dtOv','upOv'].forEach(id=>{if(id==='upOv'&&busy)return;$(id).classList.remove('on')});
});
render();
</script>
</body>
</html>
